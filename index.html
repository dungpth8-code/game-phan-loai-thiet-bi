<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siêu Nhí IT - Phân Loại Thiết Bị</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: none;
            background: linear-gradient(-45deg, rgba(15, 23, 42, 0.85), rgba(49, 46, 129, 0.85), rgba(15, 52, 96, 0.85), rgba(30, 27, 75, 0.85)),
                        url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            background-size: 400% 400%, cover;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .tech-grid {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            position: absolute; inset: 0; z-index: 1; pointer-events: none;
        }

        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(calc(-50% - 15px), -50%) rotate(-5deg); }
            50% { transform: translate(calc(-50% + 15px), -50%) rotate(5deg); }
            75% { transform: translate(calc(-50% - 15px), -50%) rotate(-5deg); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.5); } }
        .animate-float-up { animation: floatUp 1s ease-out forwards; }

        .glow-in { box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
        .glow-inout { box-shadow: 0 0 20px rgba(167, 139, 250, 0.4); }
        .glow-out { box-shadow: 0 0 20px rgba(244, 114, 182, 0.4); }
        
        /* Loading spinner cho AI */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-white w-full h-full relative">

    <canvas id="starfield" class="absolute inset-0 z-0 pointer-events-none"></canvas>
    <div class="tech-grid"></div>

    <!-- NÚT GỢI Ý AI -->
    <button id="ai-hint-btn" class="absolute top-20 right-4 z-40 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-full shadow-lg border-2 border-indigo-300 transition-transform active:scale-95 flex items-center gap-2 hidden">
        <span>🤖 Gợi ý AI</span>
    </button>

    <div class="relative z-10 w-full h-full flex flex-col">
        <div class="h-16 flex justify-between items-center px-4 md:px-6 glass-panel border-b border-white/20">
            <div class="text-lg md:text-2xl font-black text-amber-400 drop-shadow-md">
                ⭐ ĐIỂM: <span id="score">0</span>
            </div>
            <div class="text-lg md:text-2xl font-black text-white drop-shadow-md">
                Câu: <span id="q-count">1</span>/10
            </div>
            <div class="text-lg md:text-2xl font-black text-rose-400 drop-shadow-md">
                ⏳ <span id="timer">5</span>s
            </div>
        </div>

        <div class="flex-1 flex flex-col p-2 md:p-4 gap-4 relative">
            <!-- Khu vực thẻ bài (Top) -->
            <div class="h-[40%] md:h-[45%] w-full flex items-center justify-center relative">
                <div id="drag-item" class="absolute top-1/2 left-1/2 w-40 h-48 md:w-56 md:h-64 bg-white/95 backdrop-blur-sm rounded-[1.5rem] md:rounded-[2rem] shadow-[0_15px_35px_rgba(0,0,0,0.5)] flex flex-col items-center justify-center cursor-grab select-none touch-none z-40 text-slate-800 transition-transform hidden border-4 border-indigo-300 p-2 md:p-3" style="transform: translate(-50%, -50%);">
                    <div id="item-icon" class="w-full h-3/5 rounded-xl overflow-hidden pointer-events-none flex items-center justify-center bg-slate-100 shadow-inner"></div>
                    <span id="item-name" class="mt-2 md:mt-3 font-black text-base md:text-xl text-center leading-tight px-1 md:px-2 pointer-events-none text-indigo-900 h-2/5 flex items-center justify-center"></span>
                </div>
            </div>

            <!-- Khu vực 3 cổng thả (Bottom) -->
            <div class="h-[60%] md:h-[55%] w-full flex flex-col md:flex-row gap-2 md:gap-4 relative">
                <div id="zone-in" class="flex-1 rounded-2xl md:rounded-3xl border-4 border-dashed border-cyan-400/50 glass-panel flex flex-col items-center justify-center transition-all duration-300">
                    <div class="text-3xl md:text-5xl mb-0 md:mb-2 opacity-80">📥</div>
                    <div class="text-base md:text-3xl font-black text-cyan-300 tracking-wider text-center drop-shadow-lg uppercase">Thiết bị vào</div>
                </div>

                <div id="zone-inout" class="flex-1 rounded-2xl md:rounded-3xl border-4 border-dashed border-purple-400/50 glass-panel flex flex-col items-center justify-center transition-all duration-300">
                    <div class="text-3xl md:text-5xl mb-0 md:mb-2 opacity-80">🔄</div>
                    <div class="text-base md:text-3xl font-black text-purple-300 tracking-wider text-center drop-shadow-lg uppercase">Thiết bị vào/ra</div>
                </div>

                <div id="zone-out" class="flex-1 rounded-2xl md:rounded-3xl border-4 border-dashed border-pink-400/50 glass-panel flex flex-col items-center justify-center transition-all duration-300">
                    <div class="text-3xl md:text-5xl mb-0 md:mb-2 opacity-80">📤</div>
                    <div class="text-base md:text-3xl font-black text-pink-300 tracking-wider text-center drop-shadow-lg uppercase">Thiết bị ra</div>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH CHÀO MỪNG -->
    <div id="start-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur-md">
        <div class="bg-white rounded-[2rem] p-6 md:p-8 max-w-md w-[90%] text-center text-slate-800 shadow-2xl">
            <div class="text-6xl md:text-7xl mb-4 animate-bounce">🚀</div>
            <h1 class="text-2xl md:text-4xl font-black mb-4 text-indigo-600 uppercase">Trạm Không Gian<br>Tin Học 6</h1>
            <p class="text-sm md:text-lg mb-6 text-slate-600">
                Hãy kéo thả 10 thiết bị vào đúng cổng VÀO, RA, hoặc VỪA VÀO VỪA RA. Mỗi câu chỉ có 5 giây, cố lên nhé!
            </p>
            <button id="start-btn" class="w-full py-3 md:py-4 rounded-2xl bg-green-500 hover:bg-green-400 text-white font-black text-xl md:text-2xl shadow-[0_6px_0_#166534] active:translate-y-[6px] active:shadow-none transition-all">
                BẮT ĐẦU NGAY
            </button>
        </div>
    </div>

    <!-- MODAL GỢI Ý AI -->
    <div id="ai-modal" class="hidden absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-6 max-w-sm w-[90%] text-center text-slate-800 shadow-2xl border-4 border-indigo-300">
            <h3 class="text-2xl font-black mb-2 text-indigo-600">Thầy Giáo AI 🤖</h3>
            <div id="ai-response" class="text-lg text-slate-700 min-h-[80px] flex items-center justify-center mb-4 italic">
                <!-- Nội dung AI sẽ hiển thị ở đây -->
            </div>
            <button id="close-ai-btn" class="w-full py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-lg">
                Đã hiểu, quay lại Game
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH KẾT THÚC -->
    <div id="end-screen" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-slate-900/90 backdrop-blur-md">
        <div class="bg-white rounded-[2rem] p-6 md:p-8 max-w-md w-[90%] text-center text-slate-800 shadow-2xl transition-transform transform scale-95" id="end-modal">
            <h2 class="text-3xl md:text-5xl font-black mb-2 text-indigo-600">Hết Lượt! ⏱️</h2>
            <p class="text-base md:text-xl font-bold text-slate-500 mb-2">Điểm số của bạn</p>
            <div class="text-6xl md:text-7xl font-black text-amber-500 mb-4 drop-shadow-lg" id="final-score">0</div>
            <p id="end-message" class="text-lg md:text-2xl font-black mb-6 md:mb-8 px-2 md:px-4 text-rose-500"></p>
            <button id="restart-btn" class="w-full py-3 md:py-4 rounded-2xl bg-indigo-500 hover:bg-indigo-400 text-white font-black text-xl md:text-2xl shadow-[0_6px_0_#3730a3] active:translate-y-[6px] active:shadow-none transition-all">
                CHƠI LẠI
            </button>
        </div>
    </div>

    <script>
        // Danh sách thiết bị mới cập nhật
        const allDevices = [
            // Thiết bị VÀO (Input)
            { id: 'banphim', name: 'Bàn phím', type: 'in', image: 'https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=300&q=80' },
            { id: 'chuot', name: 'Chuột', type: 'in', image: 'https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?auto=format&fit=crop&w=300&q=80' },
            { id: 'micro', name: 'Micro', type: 'in', image: 'https://images.unsplash.com/photo-1590602847861-f357a9332bbc?auto=format&fit=crop&w=300&q=80' },
            { id: 'webcam', name: 'Webcam', type: 'in', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Webcam.jpg/300px-Webcam.jpg' },
            { id: 'mayquet', name: 'Máy quét (Scanner)', type: 'in', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Scanner-brother.jpg/300px-Scanner-brother.jpg' },
            { id: 'butcamung', name: 'Bút cảm ứng', type: 'in', image: 'https://images.unsplash.com/photo-1583225214464-9296029427aa?auto=format&fit=crop&w=300&q=80' },
            { id: 'bangvedientu', name: 'Bảng vẽ điện tử', type: 'in', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Wacom_Intuos_pro_M.jpg/300px-Wacom_Intuos_pro_M.jpg' },
            { id: 'taycam', name: 'Tay cầm chơi game', type: 'in', image: 'https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?auto=format&fit=crop&w=300&q=80' },
            { id: 'touchpad', name: 'Touchpad', type: 'in', image: 'https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?auto=format&fit=crop&w=300&q=80' },
            
            // Thiết bị RA (Output)
            { id: 'manhinh', name: 'Màn hình', type: 'out', image: 'https://images.unsplash.com/photo-1542393545-10f5cde2c810?auto=format&fit=crop&w=300&q=80' },
            { id: 'loa', name: 'Loa', type: 'out', image: 'https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=300&q=80' },
            { id: 'tainghe', name: 'Tai nghe', type: 'out', image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=300&q=80' },
            { id: 'mayin', name: 'Máy in', type: 'out', image: 'https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=300&q=80' },
            { id: 'maychieu', name: 'Máy chiếu', type: 'out', image: 'https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=300&q=80' },
            { id: 'tv', name: 'TV kết nối máy tính', type: 'out', image: 'https://images.unsplash.com/photo-1593305841991-05c297ba4575?auto=format&fit=crop&w=300&q=80' },

            // Thiết bị VỪA VÀO VỪA RA (Input + Output)
            { id: 'manhinhcamung', name: 'Màn hình cảm ứng', type: 'inout', image: 'https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?auto=format&fit=crop&w=300&q=80' },
            { id: 'headset', name: 'Tai nghe có micro', type: 'inout', image: 'https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb?auto=format&fit=crop&w=300&q=80' },
            { id: 'mayindanuong', name: 'Máy in đa năng', type: 'inout', image: 'https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=300&q=80' },
            { id: 'smartphone', name: 'Điện thoại thông minh', type: 'inout', image: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=300&q=80' },
            { id: 'tablet', name: 'Máy tính bảng', type: 'inout', image: 'https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?auto=format&fit=crop&w=300&q=80' },
            { id: 'smartboard', name: 'Bảng tương tác thông minh', type: 'inout', image: 'https://images.unsplash.com/photo-1516321497487-e288fb19713f?auto=format&fit=crop&w=300&q=80' }
        ];

        let sessionDevices = []; // Chứa 10 câu hỏi cho lượt chơi hiện tại
        let score = 0;
        let timeLeft = 5;
        let timerInterval;
        let currentDevice = null;
        let isGameRunning = false;
        let currentQuestion = 0;
        const maxQuestions = 10;

        // Âm thanh
        let synthCorrect, synthWrong, synthEnd;
        function initAudio() {
            if (synthCorrect) return;
            synthCorrect = new Tone.PolySynth(Tone.Synth).toDestination();
            synthCorrect.set({ oscillator: { type: 'triangle' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.5 } });
            synthCorrect.volume.value = -5;
            synthWrong = new Tone.Synth().toDestination();
            synthWrong.set({ oscillator: { type: 'sawtooth' }, envelope: { attack: 0.05, decay: 0.2, sustain: 0, release: 0.2 } });
            synthWrong.volume.value = -10;
            synthEnd = new Tone.PolySynth(Tone.Synth).toDestination();
            synthEnd.volume.value = -5;
        }

        const dragItem = document.getElementById('drag-item');
        const zoneIn = document.getElementById('zone-in');
        const zoneInout = document.getElementById('zone-inout');
        const zoneOut = document.getElementById('zone-out');
        let zoneInRect, zoneInoutRect, zoneOutRect;

        function calculateZones() {
            zoneInRect = zoneIn.getBoundingClientRect();
            zoneInoutRect = zoneInout.getBoundingClientRect();
            zoneOutRect = zoneOut.getBoundingClientRect();
        }
        window.addEventListener('resize', calculateZones);

        // Kéo thả logic
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;

        dragItem.addEventListener('pointerdown', (e) => {
            if (!isGameRunning) return;
            isDragging = true;
            dragStartX = e.clientX; dragStartY = e.clientY;
            dragItem.style.cursor = 'grabbing';
            dragItem.style.transition = 'none';
            dragItem.classList.add('scale-110');
            dragItem.setPointerCapture(e.pointerId);
            calculateZones();
        });

        dragItem.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const dx = e.clientX - dragStartX; const dy = e.clientY - dragStartY;
            dragItem.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${dx * 0.05}deg) scale(1.1)`;

            const itemRect = dragItem.getBoundingClientRect();
            const centerX = itemRect.left + itemRect.width / 2, centerY = itemRect.top + itemRect.height / 2;

            zoneIn.classList.remove('glow-in', 'bg-cyan-900/30'); zoneInout.classList.remove('glow-inout', 'bg-purple-900/30'); zoneOut.classList.remove('glow-out', 'bg-pink-900/30');
            if (isPointInRect(centerX, centerY, zoneInRect)) zoneIn.classList.add('glow-in', 'bg-cyan-900/30');
            else if (isPointInRect(centerX, centerY, zoneInoutRect)) zoneInout.classList.add('glow-inout', 'bg-purple-900/30');
            else if (isPointInRect(centerX, centerY, zoneOutRect)) zoneOut.classList.add('glow-out', 'bg-pink-900/30');
        });

        function onDragEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            dragItem.style.cursor = 'grab'; dragItem.classList.remove('scale-110');
            dragItem.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            zoneIn.classList.remove('glow-in', 'bg-cyan-900/30'); zoneInout.classList.remove('glow-inout', 'bg-purple-900/30'); zoneOut.classList.remove('glow-out', 'bg-pink-900/30');
            checkDrop();
        }

        dragItem.addEventListener('pointerup', onDragEnd);
        dragItem.addEventListener('pointercancel', onDragEnd);

        function isPointInRect(x, y, rect) { return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom; }

        function checkDrop() {
            const itemRect = dragItem.getBoundingClientRect();
            const centerX = itemRect.left + itemRect.width / 2, centerY = itemRect.top + itemRect.height / 2;
            let droppedZone = null;
            if (isPointInRect(centerX, centerY, zoneInRect)) droppedZone = 'in';
            else if (isPointInRect(centerX, centerY, zoneInoutRect)) droppedZone = 'inout';
            else if (isPointInRect(centerX, centerY, zoneOutRect)) droppedZone = 'out';

            if (droppedZone) {
                if (droppedZone === currentDevice.type) handleCorrect(centerX, centerY);
                else handleWrong(centerX, centerY);
            } else snapBack();
        }

        function handleCorrect(x, y) {
            clearInterval(timerInterval);
            score += 10; document.getElementById('score').textContent = score;
            if(synthCorrect) synthCorrect.triggerAttackRelease(["C5", "E5", "G5"], "8n");
            showFloatingText('+10', x, y, 'text-green-400');
            dragItem.classList.add('hidden');
            document.getElementById('ai-hint-btn').classList.add('hidden');
            setTimeout(() => { if (isGameRunning) nextItem(); }, 300);
        }

        function handleWrong(x, y) {
            clearInterval(timerInterval);
            score -= 5; document.getElementById('score').textContent = score;
            if(synthWrong) synthWrong.triggerAttackRelease("C3", "8n");
            showFloatingText('Sai! -5', x, y - 20, 'text-rose-500');
            dragItem.style.transition = 'none'; dragItem.classList.add('shake-anim', 'border-rose-500');
            
            // Ẩn thẻ sau khi lắc và chuyển câu luôn (Không cho thả lại)
            setTimeout(() => { 
                dragItem.classList.remove('shake-anim', 'border-rose-500'); 
                dragItem.classList.add('hidden');
                document.getElementById('ai-hint-btn').classList.add('hidden');
                if (isGameRunning) nextItem(); 
            }, 400);
        }

        function snapBack() {
            dragItem.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            dragItem.style.transform = 'translate(-50%, -50%) rotate(0deg) scale(1)';
        }

        // TẠO DANH SÁCH 10 CÂU HỎI THÔNG MINH
        function generateSessionDevices() {
            const inputs = allDevices.filter(d => d.type === 'in');
            const outputs = allDevices.filter(d => d.type === 'out');
            const inouts = allDevices.filter(d => d.type === 'inout');

            const pickAndRemove = (arr) => {
                const idx = Math.floor(Math.random() * arr.length);
                return arr.splice(idx, 1)[0];
            };

            // Bắt buộc lấy 1 thiết bị từ mỗi nhóm
            const pickedIn = pickAndRemove(inputs);
            const pickedOut = pickAndRemove(outputs);
            const pickedInOut = pickAndRemove(inouts);

            let session = [pickedIn, pickedOut, pickedInOut];

            // Gộp phần còn lại và trộn đều
            let remaining = [...inputs, ...outputs, ...inouts];
            remaining.sort(() => 0.5 - Math.random());
            
            // Lấy thêm 7 thiết bị nữa
            session.push(...remaining.slice(0, 7));

            // Trộn đều 10 thiết bị cuối cùng để tạo thứ tự ngẫu nhiên
            session.sort(() => 0.5 - Math.random());
            return session;
        }

        function nextItem() {
            currentQuestion++;
            if (currentQuestion > maxQuestions) { endGame(); return; }
            
            document.getElementById('q-count').textContent = currentQuestion;
            currentDevice = sessionDevices[currentQuestion - 1]; // Lấy từ mảng đã trộn

            const placeholderUrl = `https://placehold.co/300x300/e2e8f0/1e293b?text=${encodeURIComponent(currentDevice.name)}`;
            document.getElementById('item-icon').innerHTML = `<img src="${currentDevice.image}" alt="${currentDevice.name}" class="w-full h-full object-cover" draggable="false" onerror="this.onerror=null; this.src='${placeholderUrl}'">`;
            document.getElementById('item-name').textContent = currentDevice.name;

            dragItem.style.transition = 'none'; dragItem.style.transform = 'translate(-50%, -50%) scale(0)';
            dragItem.classList.remove('hidden', 'border-rose-500');
            document.getElementById('ai-hint-btn').classList.remove('hidden');

            setTimeout(() => {
                dragItem.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                dragItem.style.transform = 'translate(-50%, -50%) scale(1)';
                startQuestionTimer();
            }, 50);
        }

        function startQuestionTimer() {
            timeLeft = 5; document.getElementById('timer').textContent = timeLeft;
            document.getElementById('timer').classList.remove('animate-pulse', 'text-rose-500');
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--; document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 2) document.getElementById('timer').classList.add('animate-pulse', 'text-rose-500');
                if (timeLeft <= 0) handleTimeout();
            }, 1000);
        }

        function handleTimeout() {
            clearInterval(timerInterval);
            score -= 5; document.getElementById('score').textContent = score;
            if(synthWrong) synthWrong.triggerAttackRelease("C3", "8n");
            showFloatingText('Hết giờ! -5', window.innerWidth / 2, window.innerHeight / 2 - 80, 'text-rose-500');
            dragItem.classList.add('hidden');
            document.getElementById('ai-hint-btn').classList.add('hidden');
            setTimeout(() => { if (isGameRunning) nextItem(); }, 500);
        }

        function showFloatingText(text, x, y, colorClass) {
            const el = document.createElement('div'); el.textContent = text;
            el.className = `absolute text-2xl md:text-3xl font-black ${colorClass} pointer-events-none z-50 animate-float-up drop-shadow-md`;
            el.style.left = `${x}px`; el.style.top = `${y}px`; el.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(el); setTimeout(() => el.remove(), 1000); 
        }

        function startGame() {
            score = 0; currentQuestion = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            
            // Tạo mới danh sách 10 thiết bị cho lượt này
            sessionDevices = generateSessionDevices();
            
            isGameRunning = true; calculateZones(); nextItem();
        }

        function endGame() {
            isGameRunning = false; clearInterval(timerInterval);
            dragItem.classList.add('hidden'); document.getElementById('ai-hint-btn').classList.add('hidden');
            if(synthEnd) synthEnd.triggerAttackRelease(["C4", "E4", "G4", "C5"], "2n");

            const msgEl = document.getElementById('end-message');
            // Đánh giá theo thang 100 điểm
            if (score >= 80) {
                msgEl.textContent = "🏆 Xuất sắc! Bạn đích thị là Siêu Nhí IT!";
                msgEl.className = "text-lg md:text-2xl font-black mb-6 px-2 text-green-500";
            } else if (score >= 40) {
                msgEl.textContent = "👍 Rất tốt! Cố gắng phân loại nhanh hơn nhé.";
                msgEl.className = "text-lg md:text-2xl font-black mb-6 px-2 text-blue-500";
            } else {
                msgEl.textContent = "💪 Không sao cả! Luyện tập thêm để nhớ bài nào.";
                msgEl.className = "text-lg md:text-2xl font-black mb-6 px-2 text-rose-500";
            }

            document.getElementById('final-score').textContent = score;
            document.getElementById('end-screen').classList.remove('hidden');
            setTimeout(() => { document.getElementById('end-modal').classList.remove('scale-95'); document.getElementById('end-modal').classList.add('scale-100'); }, 10);
        }

        // TÍNH NĂNG AI GỢI Ý
        const apiKey = ""; 
        document.getElementById('ai-hint-btn').addEventListener('click', async () => {
            if (!currentDevice) return;
            clearInterval(timerInterval); // Tạm dừng thời gian
            dragItem.classList.add('hidden'); // Giấu thẻ đi cho đỡ vướng
            document.getElementById('ai-modal').classList.remove('hidden');
            document.getElementById('ai-response').innerHTML = '<span class="loader"></span> <span class="ml-2">Thầy đang suy nghĩ...</span>';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Học sinh lớp 6 đang phân loại thiết bị: "${currentDevice.name}". Hãy đóng vai thầy giáo vui tính, cho 1 gợi ý cực kỳ ngắn gọn (1 câu) để học sinh biết đây là thiết bị đưa thông tin VÀO máy tính, hay xuất thông tin RA ngoài, hay VỪA VÀO VỪA RA. Tuyệt đối KHÔNG nói thẳng tên cổng.` }] }]
                    })
                });
                const data = await response.json();
                document.getElementById('ai-response').innerHTML = `"${data.candidates[0].content.parts[0].text}"`;
            } catch (error) {
                document.getElementById('ai-response').innerHTML = "Rất tiếc, bộ đàm kết nối với thầy giáo đang bị nhiễu sóng. Em hãy tự thử sức nhé!";
                console.error(error);
            }
        });

        document.getElementById('close-ai-btn').addEventListener('click', () => {
            document.getElementById('ai-modal').classList.add('hidden');
            dragItem.classList.remove('hidden');
            startQuestionTimer(); // Tiếp tục đếm ngược 5 giây lại từ đầu cho câu này
        });

        document.getElementById('start-btn').addEventListener('click', async () => { await Tone.start(); initAudio(); startGame(); });
        document.getElementById('restart-btn').addEventListener('click', () => { document.getElementById('end-modal').classList.remove('scale-100'); document.getElementById('end-modal').classList.add('scale-95'); startGame(); });

        // Hiệu ứng hạt nền
        const canvas = document.getElementById('starfield'); const ctx = canvas.getContext('2d'); let particles = [];
        function initStars() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight; particles = [];
            for(let i=0; i<60; i++) particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2.5 + 1, speedX: (Math.random() - 0.5) * 0.8, speedY: (Math.random() - 0.5) * 0.8, opacity: Math.random() * 0.5 + 0.2 });
        }
        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0 || p.x > canvas.width) p.speedX *= -1; if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
                ctx.fillStyle = `rgba(34, 211, 238, ${p.opacity})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                for(let j = index + 1; j < particles.length; j++) {
                    let p2 = particles[j], dist = Math.sqrt(Math.pow(p.x - p2.x, 2) + Math.pow(p.y - p2.y, 2));
                    if(dist < 120) { ctx.strokeStyle = `rgba(34, 211, 238, ${0.15 * (1 - dist/120)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
                }
            });
            requestAnimationFrame(animateStars);
        }
        window.addEventListener('resize', initStars); initStars(); animateStars();
    </script>
</body>
</html>
